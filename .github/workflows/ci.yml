# Checks on every push to main and every pull request. Nothing is packaged here:
# a package belongs to a tag, and that is release.yml's job.
#
# The steps are exactly `just check` (scripts/version.sh --check, gofmt, go vet,
# scripts/check-deps.sh, go test). `just` is not installed on the runner, so the
# scripts are called directly instead of duplicating their logic in YAML.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run it superseded. main is never
# cancelled: every commit that lands there is a commit a tag may be cut from.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The version constant is generated from viva.toml and committed, so a pull
      # request that edits one and not the other stops here before anything compiles.
      - name: Verify the generated version
        shell: bash
        run: bash scripts/version.sh --check

      - name: Check formatting
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: Vet
        shell: bash
        run: go vet ./...

      # A package that imports upward fails here, before the tests would pass on it.
      - name: Check the layers
        shell: bash
        run: bash scripts/check-deps.sh

      - name: Test
        shell: bash
        run: go test ./... -count=1
